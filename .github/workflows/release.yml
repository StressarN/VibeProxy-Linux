name: Build Linux Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read base version
        id: version
        shell: bash
        run: |
          if [ -f VERSION ]; then
            echo "VERSION_FROM_FILE=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute artifact version
        id: artifact
        env:
          VERSION_FROM_FILE: ${{ steps.version.outputs.VERSION_FROM_FILE }}
        shell: bash
        run: |
          version="dev"
          short_sha="${GITHUB_SHA::7}"
          ref_name="$(echo "${GITHUB_REF_NAME}" | sed 's/[^A-Za-z0-9._-]/-/g')"

          if [[ "${GITHUB_REF}" =~ ^refs/tags/v(.+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            echo "Using version from git tag: ${version}"
          elif [ -n "${VERSION_FROM_FILE}" ]; then
            version="${VERSION_FROM_FILE}-${ref_name}-${short_sha}"
            echo "Using snapshot version from VERSION file, branch, and commit: ${version}"
          else
            version="dev-${ref_name}-${short_sha}"
            echo "Using fallback snapshot version: ${version}"
          fi

          echo "APP_VERSION=${version}" >> "$GITHUB_OUTPUT"
          echo "ZIP_NAME=VibeProxy-Linux-${version}.zip" >> "$GITHUB_OUTPUT"

      - name: Build release package
        env:
          APP_VERSION: ${{ steps.artifact.outputs.APP_VERSION }}
        run: bash scripts/build-linux.sh Release

      - name: Calculate checksums
        shell: bash
        run: |
          cd out
          sha256sum "${{ steps.artifact.outputs.ZIP_NAME }}" > "${{ steps.artifact.outputs.ZIP_NAME }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeProxy-Linux-${{ steps.artifact.outputs.APP_VERSION }}
          path: |
            out/${{ steps.artifact.outputs.ZIP_NAME }}
            out/${{ steps.artifact.outputs.ZIP_NAME }}.sha256
          retention-days: 30

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/${{ steps.artifact.outputs.ZIP_NAME }}
            out/${{ steps.artifact.outputs.ZIP_NAME }}.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## VibeProxy Linux ${{ steps.artifact.outputs.APP_VERSION }}

            ### Installation

            1. Download `VibeProxy-Linux-${{ steps.artifact.outputs.APP_VERSION }}.zip`
            2. Extract the archive
            3. Run the bundled `VibeProxy.Linux` binary

            ### What's New

            See the [CHANGELOG](https://github.com/StressarN/VibeProxy-Linux/blob/main/CHANGELOG.md) for details.

            ### Verification

            Verify the download with:
            ```bash
            sha256sum -c VibeProxy-Linux-${{ steps.artifact.outputs.APP_VERSION }}.zip.sha256
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
